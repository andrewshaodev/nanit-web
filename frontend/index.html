<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nanit Home Assistant Bridge Dashboard" />
    <title>Nanit Web</title>
    <!-- Apply the saved light/dark choice before first paint, so the page
         doesn't flash the other theme. Mirrors resolve()/apply() in
         src/lib/theme.ts. -->
    <script>
      (function () {
        var pref = 'system'
        try { pref = localStorage.getItem('theme') || 'system' } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('mocha', dark)
      })()
    </script>
  </head>
  <body class="font-sans text-sm bg-background text-foreground min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
